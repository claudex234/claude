<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proforma — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="productos.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="generador.jsx"></script>
<script type="text/babel" src="detalle.jsx"></script>
<script type="text/babel" src="listado.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="productos-page.jsx"></script>
<script type="text/babel" src="stock-page.jsx"></script>
<script type="text/babel" src="adjuntos.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const t = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState("generador"); // mostrar generador con la nueva plantilla
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
  }, [t.theme]);

  const goToDetail = (id) => setPage("detalle");
  const goToGenerador = () => setPage("generador");
  const goBack = () => setPage("proformas");

  return (
    <div className="app" data-screen-label={page}>
      <Sidebar page={page} setPage={setPage} collapsed={sidebarCollapsed} setCollapsed={setSidebarCollapsed} />
      <div className="main">
        <div className="topbar">
          <div className="crumb">
            <span style={{ textTransform: "capitalize" }}>{
              page === "detalle" ? "Proformas" :
              page === "proformas" ? "Proformas" :
              page === "generador" ? "Nueva proforma" :
              page === "productos" ? "Productos" :
              page === "stock" ? "Stock" :
              page === "adjuntos" ? "Adjuntos" :
              page === "templates" ? "Plantillas" :
              page === "config" ? "Configuración" :
              "Dashboard"
            }</span>
            {page === "detalle" && <><Icon name="chevron" size={11} /><b>PRF-2026-0141</b></>}
          </div>
          <div className="topbar-actions">
            <button className="btn btn-ghost btn-icon" title="Buscar"><Icon name="search" /></button>
            <button className="btn btn-ghost btn-icon" title="Notificaciones" style={{ position: "relative" }}>
              <Icon name="bell" />
              <span style={{ position: "absolute", top: 4, right: 4, width: 7, height: 7, borderRadius: "50%", background: "var(--danger)" }} />
            </button>
          </div>
        </div>

        {page === "dashboard" && <Dashboard goToDetail={goToDetail} goToGenerador={goToGenerador} />}
        {page === "proformas" && <Listado goToDetail={goToDetail} goToGenerador={goToGenerador} />}
        {page === "generador" && <Generador goToDetail={() => setPage("detalle")} />}
        {page === "detalle" && <Detalle goBack={goBack} />}
        {page === "templates" && <Plantillas />}
        {page === "productos" && <ProductosPage goToAdjuntos={() => setPage("adjuntos")} />}
        {page === "stock" && <StockPage />}
        {page === "adjuntos" && <Adjuntos />}
        {page === "config" && <Config />}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Estilo visual">
          <TweakSelect
            label="Tema"
            value={t.theme}
            onChange={v => t.set("theme", v)}
            options={[
              { value: "dark", label: "Oscuro (default)" },
              { value: "stripe", label: "Stripe (claro azul)" },
              { value: "warm", label: "Cálido (serif)" },
              { value: "mono", label: "Mono (Linear)" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Navegación">
          <div style={{ display: "grid", gap: 6 }}>
            {[
              { id: "dashboard", l: "Dashboard" },
              { id: "proformas", l: "Listado" },
              { id: "generador", l: "Generador (split-view)" },
              { id: "detalle", l: "Detalle + tracking ★" },
              { id: "templates", l: "Plantillas" },
              { id: "config", l: "Configuración" },
            ].map(it => (
              <button key={it.id}
                onClick={() => setPage(it.id)}
                className="btn btn-sm"
                style={{
                  justifyContent: "flex-start",
                  background: page === it.id ? "var(--accent-soft)" : "transparent",
                  borderColor: page === it.id ? "var(--accent)" : "var(--border)",
                  color: page === it.id ? "var(--accent-strong)" : "var(--text-2)",
                  fontWeight: page === it.id ? 600 : 500,
                }}>
                {it.l}
              </button>
            ))}
          </div>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
