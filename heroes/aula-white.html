<title>Blanco + grano (pared)</title><style>
  html,body{margin:0;height:100%;background:#111;display:grid;place-items:center}
  .hero-wrap{position:relative;display:inline-block;width:min(92vw,1100px);
             overflow:hidden;border-radius:10px;line-height:0}
  .hero{display:block;width:100%;height:auto}
  /* Sheen: rayo de luz diagonal (skewX) que barre; solo anima transform */
  .sheen{position:absolute;top:-60%;left:0;width:38%;height:220%;pointer-events:none;
         transform:skewX(-20deg) translateX(-190%);
         background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.05) 38%,rgba(255,255,255,.18) 47%,rgba(255,255,255,.34) 50%,rgba(255,255,255,.18) 53%,rgba(255,255,255,.05) 62%,transparent 100%);
         mix-blend-mode:screen;filter:blur(2px);will-change:transform;
         animation:sheen 6.5s ease-in-out infinite}
  @keyframes sheen{0%{transform:skewX(-20deg) translateX(-190%)}
                   55%,100%{transform:skewX(-20deg) translateX(430%)}}

  /* Tiles: solo hover (sin entrada ni efectos de carga) */
  .tile{transform-box:fill-box;transform-origin:center;cursor:pointer;transition:transform .25s ease}
  .tile:hover{transform:translateY(-3%) scale(1.05)}

  @media (prefers-reduced-motion:reduce){.sheen{animation:none}}


  html,body{height:auto;min-height:100%;display:block;margin:0;width:100%;background:#fff}
  *{box-sizing:border-box}
  .scene{position:relative;width:100%;min-height:100vh;overflow:hidden;display:grid;place-items:center;padding:6vh 6vw}
  .bg{position:absolute;inset:0;width:100%;height:100%}
  .device{position:relative;width:min(84vw,920px)}
  .device .hero-wrap{width:100%;box-shadow:0 50px 90px rgba(0,0,0,.30),0 16px 38px rgba(0,0,0,.20)}
  .tag{position:absolute;left:18px;bottom:16px;font:600 13px Arial,sans-serif;color:#333;
       background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.12);border-radius:999px;
       padding:.4em .9em;backdrop-filter:blur(6px);z-index:3}
</style></head>

  (function () {
    const timeEl = document.getElementById('clock-time');
    const ampmEl = document.getElementById('clock-ampm');
    const dateEl = document.getElementById('date');
    function tick() {
      const d = new Date();
      let h = d.getHours();
      const ampm = h < 12 ? 'AM' : 'PM';
      h = h % 12 || 12;
      const mm = String(d.getMinutes()).padStart(2, '0');
      timeEl.firstChild.nodeValue = h + ':' + mm;
      ampmEl.textContent = ampm;
      let s = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
      dateEl.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    }
    tick();
    setInterval(tick, 1000);
  })();
